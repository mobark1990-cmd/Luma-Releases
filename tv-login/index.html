<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luma · تسجيل دخول التلفزيون</title>
<style>
  :root{--bg:#0f0b1a;--card:#1b1530;--fg:#f3f0ff;--muted:#a59fc0;--acc:#7c6cff;--err:#ff6b81;--ok:#4ade80}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif;padding:16px}
  .card{width:100%;max-width:400px;background:var(--card);border-radius:16px;padding:24px}
  h1{margin:0 0 4px;font-size:22px} p{color:var(--muted);margin:0 0 16px}
  .code{font:700 28px/1 ui-monospace,monospace;letter-spacing:4px;text-align:center;background:#00000033;border-radius:10px;padding:14px;margin:0 0 16px;direction:ltr}
  label{display:block;font-size:14px;margin:10px 0 4px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid #3a3260;background:#120e22;color:var(--fg);font-size:16px;direction:ltr}
  button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button.sec{background:transparent;border:1px solid #3a3260;margin-top:8px}
  button:disabled{opacity:.6}
  .msg{margin-top:14px;min-height:1.6em} .err{color:var(--err)} .ok{color:var(--ok)}
  .hidden{display:none}
</style>
</head>
<body>
<main class="card">
  <h1>Luma</h1>
  <p>وافق على تسجيل دخول التلفزيون بحسابك.</p>
  <div class="code" id="code">—</div>

  <section id="auth">
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="email">
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="signin">تسجيل الدخول</button>
    <button id="signup" class="sec">إنشاء حساب جديد</button>
  </section>

  <section id="approve" class="hidden">
    <p id="who"></p>
    <button id="approveBtn">موافقة على دخول التلفزيون</button>
    <button id="signout" class="sec">تسجيل الخروج</button>
  </section>

  <div class="msg" id="msg" role="status"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://hcjbnmheonbfllkdhrph.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8METCoHofX0o6ddhExRjDA_EX5LXfes";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const code = (new URLSearchParams(location.search).get("code") || "").trim();
const $ = (id) => document.getElementById(id);
const say = (text, cls) => { $("msg").textContent = text; $("msg").className = "msg " + (cls || ""); };
$("code").textContent = code || "—";
if (!code) say("الرابط ناقص: لا يوجد رمز. امسح الباركود من التلفزيون مرة أخرى.", "err");

async function render() {
  const { data: { session } } = await sb.auth.getSession();
  $("auth").classList.toggle("hidden", !!session);
  $("approve").classList.toggle("hidden", !session);
  if (session) $("who").textContent = "مسجّل باسم: " + (session.user.email || "");
}

async function withBusy(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { say(e.message || String(e), "err"); }
  finally { btn.disabled = false; }
}

$("signin").onclick = () => withBusy($("signin"), async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) throw error;
  say(""); await render();
});

$("signup").onclick = () => withBusy($("signup"), async () => {
  const { data, error } = await sb.auth.signUp({ email: $("email").value.trim(), password: $("password").value, options: { emailRedirectTo: location.href } });
  if (error) throw error;
  if (data.session) { say("تم إنشاء الحساب.", "ok"); await render(); }
  else say("أرسلنا رابط تأكيد إلى بريدك. افتحه ثم ارجع لهذه الصفحة.", "ok");
});

$("approveBtn").onclick = () => withBusy($("approveBtn"), async () => {
  if (!code) throw new Error("لا يوجد رمز في الرابط.");
  const { data, error } = await sb.rpc("approve_tv_login_session", { p_code: code });
  if (error) throw error;
  const row = Array.isArray(data) ? data[0] : data;
  if (row && row.success) say("تمت الموافقة. التلفزيون سيسجّل دخوله خلال ثوانٍ.", "ok");
  else say("الرمز غير صالح أو انتهت صلاحيته. حدّث الرمز في التلفزيون وحاول مرة أخرى.", "err");
});

$("signout").onclick = async () => { await sb.auth.signOut(); say(""); render(); };
sb.auth.onAuthStateChange(() => render());
render();
</script>
</body>
</html>
